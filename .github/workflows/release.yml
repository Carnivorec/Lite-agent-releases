name: Release Lite-agent

# Builds Lite-agent from the private source repository and publishes the
# binaries, the Docker image and the install scripts from this public repo.
# Tests run in the private repository; nothing here prints source code.

on:
  workflow_dispatch:
    inputs:
      version:
        description: Release tag, four numeric segments (for example 2.3.11.0)
        required: true
        type: string
      source_ref:
        description: Branch, tag or commit of the private Lite-agent source
        required: true
        default: main
        type: string

permissions:
  contents: read

env:
  SOURCE_REPOSITORY: Carnivorec/Lite-agent
  REGISTRY: ghcr.io
  IMAGE_NAME: carnivorec/lite-agent

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.meta.outputs.version }}
      source_sha: ${{ steps.meta.outputs.source_sha }}
    steps:
      - name: Validate version
        env:
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "Invalid version: $VERSION" >&2; exit 1; }

      - name: Checkout private source
        uses: actions/checkout@v4
        with:
          repository: ${{ env.SOURCE_REPOSITORY }}
          ref: ${{ inputs.source_ref }}
          ssh-key: ${{ secrets.LITE_AGENT_DEPLOY_KEY }}
          persist-credentials: false
          path: src

      - name: Record source commit
        id: meta
        env:
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "source_sha=$(git -C src rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  build:
    needs: prepare
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      matrix:
        goos: [windows, linux, darwin, freebsd]
        goarch: [amd64, arm64, 386, arm]
        exclude:
          - goos: windows
            goarch: arm
          - goos: darwin
            goarch: 386
          - goos: darwin
            goarch: arm
        include:
          - goos: linux
            goarch: loong64
    steps:
      - name: Checkout private source
        uses: actions/checkout@v4
        with:
          repository: ${{ env.SOURCE_REPOSITORY }}
          ref: ${{ needs.prepare.outputs.source_sha }}
          ssh-key: ${{ secrets.LITE_AGENT_DEPLOY_KEY }}
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.26.10"
          check-latest: false
          cache: false

      - name: Build binary
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: 0
          GOTOOLCHAIN: local
          VERSION: ${{ needs.prepare.outputs.version }}
          SOURCE_SHA: ${{ needs.prepare.outputs.source_sha }}
        run: |
          set -euo pipefail
          test "$(go env GOVERSION)" = "go1.26.10"
          name="Lite-agent-${GOOS}-${GOARCH}"
          if [ "$GOOS" = "windows" ]; then name="${name}.exe"; fi
          go build -trimpath \
            -ldflags="-s -w -X github.com/nuomiiiii/lite-agent/update.CurrentVersion=${VERSION}+${SOURCE_SHA::7} -X github.com/nuomiiiii/lite-agent/update.Repo=${GITHUB_REPOSITORY}" \
            -o "dist/${name}"

      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: Lite-agent-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/*
          if-no-files-found: error

  release:
    needs: [prepare, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout this repository
        uses: actions/checkout@v4
        with:
          path: pub

      - name: Checkout private source scripts
        uses: actions/checkout@v4
        with:
          repository: ${{ env.SOURCE_REPOSITORY }}
          ref: ${{ needs.prepare.outputs.source_sha }}
          ssh-key: ${{ secrets.LITE_AGENT_DEPLOY_KEY }}
          persist-credentials: false
          path: src
          sparse-checkout: |
            install.sh
            install.ps1
          sparse-checkout-cone-mode: false

      - name: Sync install scripts to main
        working-directory: pub
        run: |
          set -euo pipefail
          cp ../src/install.sh ../src/install.ps1 .
          if [ -n "$(git status --porcelain -- install.sh install.ps1)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add install.sh install.ps1
            git commit -m "Install scripts for ${{ needs.prepare.outputs.version }}"
            git push origin HEAD:main
          fi

      - name: Download binaries
        uses: actions/download-artifact@v4
        with:
          pattern: Lite-agent-*
          path: dist
          merge-multiple: true

      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          set -euo pipefail
          cd dist
          sha256sum Lite-agent-* > SHA256SUMS
          cd ..
          target="$(git -C pub rev-parse HEAD)"
          notes="Lite-agent ${VERSION}. Automatic updates and remote control are off by default."
          if gh release view "$VERSION" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$VERSION" dist/* --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$VERSION" dist/* --repo "$GITHUB_REPOSITORY" --target "$target" --title "$VERSION" --notes "$notes"
          fi

  docker:
    needs: [prepare, build]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout private source
        uses: actions/checkout@v4
        with:
          repository: ${{ env.SOURCE_REPOSITORY }}
          ref: ${{ needs.prepare.outputs.source_sha }}
          ssh-key: ${{ secrets.LITE_AGENT_DEPLOY_KEY }}
          persist-credentials: false
          sparse-checkout: Dockerfile
          sparse-checkout-cone-mode: false

      - name: Download Linux binaries
        uses: actions/download-artifact@v4
        with:
          pattern: Lite-agent-linux-*
          path: .
          merge-multiple: true

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          provenance: false
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ needs.prepare.outputs.version }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.version=${{ needs.prepare.outputs.version }}
